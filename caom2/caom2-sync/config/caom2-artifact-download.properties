# log level
org.opencadc.caom2.download.logging=info

# caom2 database settings
org.opencadc.caom2.download.schema=caom2
org.opencadc.caom2.download.username=cadmin
org.opencadc.caom2.download.password=pw-cadmin
org.opencadc.caom2.download.url=jdbc:postgresql://caom2syncdb/content

# ArtifactStore implementation
ca.nrc.cadc.caom2.artifact.ArtifactStore=org.opencadc.caom2.inventory.InventoryArtifactStore

# The namespace to use
org.opencadc.caom2.download.namespace=cadc:IRIS/
org.opencadc.caom2.download.buckets=0-f


# Number of download threads (default: 1)
org.opencadc.caom2.download.threads=4

# Hours after failed downloads should be retried (default: 24)
org.opencadc.caom2.download.retryAfter=24

