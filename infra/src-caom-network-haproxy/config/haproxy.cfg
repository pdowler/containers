global
  log /dev/log local0 debug
  maxconn 256 

defaults
  mode http
  timeout connect 12000ms
  timeout client  90000ms
  timeout server  90000ms
  timeout http-keep-alive 6000ms
  maxconn 256 
  option redispatch
  retries 1 
  option http-keep-alive
  option httplog
  option forwardfor
  option httpchk HEAD / HTTP/1.0

frontend https-in
   log global
   bind *:443 ssl crt /config/server-cert.pem ca-file /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem verify optional
   mode http
   option forwardfor
   option http-server-close
   http-request set-header X-Client-Certificate %[ssl_c_der,base64]


   # local integration testing
   use_backend torkeep  if { path_beg /torkeep }
   use_backend argus   if { path_beg /argus }
   
## haproxy docker container uses 172.40.0.2

## caom2
backend torkeep 
   mode http
   server torkeep 172.40.0.11:8080
backend argus 
   mode http
   server argus 172.40.0.12:8080

